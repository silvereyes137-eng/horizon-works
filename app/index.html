<!doctype html>
<html lang="en">
<head>

<title>HALO Companion Demo</title>
<style>
:root{color-scheme:dark;--ground:#0B0C0E;--panel:#141519;--panel-2:#1A1C21;--text:#F2F1EE;--muted:rgba(242,241,238,.48);--line:rgba(255,255,255,.07);--amber:#E8794A;--glow:#FFA35C;--status-h:58px;--tabs-h:76px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--text)}body{min-width:320px;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{color:inherit}button,.task-row,.tab{touch-action:manipulation;transition:transform .12s ease,opacity .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease}button:active,.task-row:active,.tab:active{transform:scale(.97);opacity:.82}button:focus-visible,input:focus-visible,.task-row:focus-visible{outline:2px solid var(--glow);outline-offset:2px}.app-shell{height:100vh;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 88% 5%,rgba(232,121,74,.08),transparent 26%),var(--ground)}.status{position:fixed;z-index:20;inset:0 0 auto;height:var(--status-h);display:flex;align-items:center;justify-content:space-between;padding:10px 18px 0;background:linear-gradient(var(--ground) 72%,rgba(11,12,14,.88));border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.12em}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 11px var(--glow)}.clock{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}.viewport{position:fixed;inset:var(--status-h) 0 var(--tabs-h);overflow:hidden}.track{height:100%;width:300%;display:flex;will-change:transform;transform:translateX(calc(var(--base,0%) + var(--drag,0px)));transition:transform 350ms cubic-bezier(.22,.9,.24,1)}.track.dragging{transition:none}.view{position:relative;width:33.333333%;height:100%;flex:none;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.view::-webkit-scrollbar,.messages::-webkit-scrollbar{display:none}.content{padding:25px 16px 30px;max-width:560px;margin:0 auto}.eyebrow{margin:0 0 7px;color:var(--muted);font:600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}h1,h2,p{margin-top:0}h1{font-size:clamp(27px,9vw,38px);line-height:1.06;letter-spacing:-.045em;margin-bottom:8px}h2{font-size:15px;letter-spacing:-.01em;margin-bottom:0}.greeting{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}.streak{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.04em;background:rgba(232,121,74,.05)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.focus-card{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:12px;padding:17px;margin-bottom:23px;overflow:hidden;position:relative}.focus-card:after{content:"";position:absolute;width:110px;height:110px;right:-45px;top:-55px;background:rgba(232,121,74,.1);filter:blur(28px);border-radius:50%;pointer-events:none}.ring-wrap{width:112px;height:112px;display:grid;place-items:center;position:relative}.ring-wrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7}.ring-value{fill:none;stroke:var(--amber);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,163,92,.28));transition:stroke-dashoffset .85s cubic-bezier(.22,.9,.24,1)}.score{font-size:30px;font-weight:750;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.score small{font-size:10px;color:var(--muted);letter-spacing:0;margin-left:2px}.score.tick{animation:scoreTick .42s cubic-bezier(.2,1.7,.4,1)}@keyframes scoreTick{50%{transform:scale(1.2);color:var(--amber)}}.focus-copy p{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 13px}.primary,.add-button,.send,.ghost{border:0;min-height:44px;cursor:pointer}.primary{border-radius:11px;background:var(--amber);color:#160E09;padding:0 14px;font-size:12px;font-weight:750;box-shadow:0 8px 26px rgba(232,121,74,.14)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.task-count{font-size:10px;color:var(--muted)}.tasks{display:grid;gap:7px}.task-row{min-height:51px;border:1px solid var(--line);border-radius:13px;background:var(--panel);display:grid;grid-template-columns:28px 1fr;align-items:center;padding:7px 12px;cursor:pointer;position:relative}.check{width:20px;height:20px;border:1.5px solid rgba(242,241,238,.26);border-radius:7px;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease}.check svg{width:13px;height:13px;fill:none;stroke:#160E09;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .28s ease}.task-row.done .check{background:var(--amber);border-color:var(--amber)}.task-row.done .check svg{stroke-dashoffset:0}.task-text{font-size:13px;line-height:1.3;transition:color .22s ease}.task-row.done .task-text{text-decoration:line-through;color:rgba(242,241,238,.32)}.add-row{display:grid;grid-template-columns:1fr 44px;gap:7px;margin-top:8px}.add-row input{width:100%;height:46px;border:1px dashed rgba(255,255,255,.13);border-radius:13px;background:transparent;color:var(--text);padding:0 13px;font-size:13px}.add-row input::placeholder{color:rgba(242,241,238,.36)}.add-button{border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:21px;color:var(--amber)}.chat-view{overflow:hidden}.chat-head{position:absolute;z-index:2;inset:0 0 auto;height:58px;padding:17px 18px 10px;background:linear-gradient(var(--ground) 78%,transparent);pointer-events:none}.chat-head p{font-size:10px;color:var(--muted);margin:4px 0 0}.messages{position:absolute;inset:0;overflow-y:auto;padding:72px 14px 88px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none}.message{max-width:84%;font-size:13px;line-height:1.48;padding:11px 13px;border-radius:15px;animation:messageIn .28s cubic-bezier(.22,.9,.24,1)}.message.assistant{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:5px}.message.user{align-self:flex-end;background:rgba(232,121,74,.18);border:1px solid rgba(232,121,74,.25);border-bottom-right-radius:5px}@keyframes messageIn{from{opacity:0;transform:translateY(8px)}}.typing{display:flex;gap:4px;align-items:center;min-height:40px;width:56px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:typing 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}.composer{position:absolute;z-index:3;inset:auto 0 0;display:grid;grid-template-columns:1fr 48px;gap:8px;padding:10px 12px;background:linear-gradient(transparent,var(--ground) 25%)}.composer input{min-width:0;height:48px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:0 14px;color:var(--text);font-size:13px}.composer input::placeholder{color:rgba(242,241,238,.35)}.send{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#160E09}.send svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pulse-content{padding-bottom:40px}.pulse-title{margin-bottom:22px}.chart-card{padding:18px 15px 14px;margin-bottom:12px}.chart{height:150px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding:6px 1px 0}.bar-col{height:100%;flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center}.bar{width:min(22px,70%);height:var(--h);background:rgba(232,121,74,.3);border-radius:5px 5px 2px 2px;transform-origin:bottom;transform:scaleY(.04)}.bar.today{background:var(--amber);box-shadow:0 0 16px rgba(255,163,92,.15)}.pulse-view.entered .bar{animation:grow .55s cubic-bezier(.22,.9,.24,1) forwards;animation-delay:var(--d)}@keyframes grow{to{transform:scaleY(1)}}.days{display:flex;gap:8px;padding-top:9px}.days span{flex:1;text-align:center;color:var(--muted);font:600 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.days .today{color:var(--amber)}.stats{display:grid;gap:8px;margin:12px 0}.stat{min-height:66px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px}.stat-value{font-size:16px;font-weight:700}.up{font-size:10px;color:var(--amber);margin-left:5px}.spark{width:72px;height:30px;fill:none;stroke:var(--amber);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.report{padding:18px}.report .eyebrow{color:var(--amber)}.report p{font-family:Georgia,"Iowan Old Style",serif;font-size:17px;line-height:1.45;margin:10px 0 16px}.ghost{border-radius:11px;padding:0 14px;background:transparent;border:1px solid rgba(232,121,74,.35);color:var(--amber);font-size:12px;font-weight:700}.tabs{position:fixed;z-index:20;inset:auto 0 0;height:var(--tabs-h);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px max(8px,env(safe-area-inset-bottom));background:rgba(11,12,14,.97);border-top:1px solid var(--line)}.tab{min-width:0;min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(242,241,238,.45);font-size:9px;font-weight:700;letter-spacing:.09em;cursor:pointer;border-radius:12px}.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.tab.active{color:var(--amber);background:rgba(232,121,74,.06)}.toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--tabs-h) + 12px);transform:translate(-50%,14px);opacity:0;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;background:var(--text);color:var(--ground);border-radius:999px;padding:10px 14px;font-size:11px;font-weight:750;transition:opacity .2s ease,transform .3s cubic-bezier(.22,.9,.24,1)}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:355px){.content{padding-left:12px;padding-right:12px}.focus-card{grid-template-columns:104px 1fr;padding:13px}.ring-wrap{width:100px;height:100px}.focus-copy p{font-size:11px}.primary{padding:0 10px}.greeting{align-items:flex-start;flex-direction:column}.streak{align-self:flex-start}.message{max-width:90%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app-shell"><header class="status"><div class="brand"><span class="brand-dot"></span>HALO</div><time class="clock" id="clock">00:00</time></header><main class="viewport" id="viewport"><div class="track" id="track">
<section class="view today-view" aria-labelledby="today-heading"><div class="content"><div class="greeting"><div><p class="eyebrow" id="dateLine"></p><h1 id="today-heading">Good morning.</h1></div><div class="streak">▲ 6-day streak</div></div><article class="card focus-card" aria-label="Focus score"><div class="ring-wrap"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="ring-track" cx="56" cy="56" r="46"></circle><circle class="ring-value" id="ringValue" cx="56" cy="56" r="46"></circle></svg><div class="score" id="score">72<small>/100</small></div></div><div class="focus-copy"><h2>Focus</h2><p>Your rhythm is stronger than yesterday.</p><button class="primary" id="focusButton" type="button">+ Focus session</button></div></article><div class="section-head"><h2>Today</h2><span class="task-count" id="taskCount"></span></div><div class="tasks" id="tasks"></div><form class="add-row" id="taskForm"><input id="taskInput" maxlength="80" autocomplete="off" aria-label="New task" placeholder="+ Add task"><button class="add-button" type="submit" aria-label="Add task">+</button></form></div></section>
<section class="view chat-view" aria-labelledby="chat-heading" inert aria-hidden="true"><div class="chat-head"><h2 id="chat-heading">CHAT</h2><p>HALO companion · local demo</p></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="chatForm"><input id="chatInput" maxlength="240" autocomplete="off" aria-label="Message" placeholder="Message HALO"><button class="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg></button></form></section>
<section class="view pulse-view" id="pulseView" aria-labelledby="pulse-heading" inert aria-hidden="true"><div class="content pulse-content"><div class="pulse-title"><p class="eyebrow">Last 7 days</p><h1 id="pulse-heading">This week</h1></div><article class="card chart-card" aria-label="Weekly focus bar chart"><div class="chart"><div class="bar-col"><div class="bar" style="--h:42%;--d:.04s"></div></div><div class="bar-col"><div class="bar" style="--h:66%;--d:.09s"></div></div><div class="bar-col"><div class="bar" style="--h:53%;--d:.14s"></div></div><div class="bar-col"><div class="bar" style="--h:81%;--d:.19s"></div></div><div class="bar-col"><div class="bar" style="--h:62%;--d:.24s"></div></div><div class="bar-col"><div class="bar" style="--h:47%;--d:.29s"></div></div><div class="bar-col"><div class="bar today" style="--h:76%;--d:.34s"></div></div></div><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span class="today">S</span></div></article><div class="stats"><article class="card stat"><div><div class="stat-label">Focus time</div><div class="stat-value">4h 12m <span class="up">▲ 18%</span></div></div><svg class="spark" viewBox="0 0 72 30" aria-hidden="true"><path d="M2 24 13 18 22 21 34 10 44 14 56 5 70 8"></path></svg></article><article class="card stat"><div><div class="stat-label">Sessions</div><div class="stat-value">9 <span class="up">▲ 3</span></div></div><svg class="spark" viewBox="0 0 72 30" aria-hidden="true"><path d="M2 22 12 23 23 15 34 18 46 9 57 13 70 4"></path></svg></article></div><article class="card report"><p class="eyebrow">Weekly report</p><p>Your deepest focus lands between 09:00–11:00. Guard it.</p><button class="ghost" id="exportButton" type="button">Export →</button></article></div></section>
</div></main><nav class="tabs" aria-label="HALO sections"><button class="tab active" type="button" data-tab="0" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5h16M7 15.5a5 5 0 0 1 10 0M12 4v3M5.6 7.2l2.1 2.1M18.4 7.2l-2.1 2.1"></path></svg><span>TODAY</span></button><button class="tab" type="button" data-tab="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5 3.8 21l.5-4A8 8 0 1 1 7 19.5"></path></svg><span>CHAT</span></button><button class="tab" type="button" data-tab="2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2.5-7 1.5 2h4"></path></svg><span>PULSE</span></button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>
(function(){'use strict';var clock=document.getElementById('clock');function updateClock(){var d=new Date();clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}updateClock();setInterval(updateClock,60000);var now=new Date(),hour=now.getHours();document.getElementById('today-heading').textContent='Good '+(hour<12?'morning':hour<18?'afternoon':'evening')+'.';document.getElementById('dateLine').textContent=new Intl.DateTimeFormat('en',{weekday:'long',month:'short',day:'numeric'}).format(now);
var ring=document.getElementById('ringValue'),scoreEl=document.getElementById('score'),score=72,circ=2*Math.PI*46;ring.style.strokeDasharray=String(circ);ring.style.strokeDashoffset=String(circ);function drawScore(animate){ring.style.strokeDashoffset=String(circ*(1-score/100));scoreEl.innerHTML=String(score)+'<small>/100</small>';if(animate){scoreEl.classList.remove('tick');void scoreEl.offsetWidth;scoreEl.classList.add('tick')}}requestAnimationFrame(function(){requestAnimationFrame(function(){drawScore(false)})});var toast=document.getElementById('toast'),toastTimer;function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},1800)}document.getElementById('focusButton').addEventListener('click',function(){score=Math.min(100,score+4+Math.floor(Math.random()*4));drawScore(true);showToast(score===100?'Focus score complete':'Focus score increased')});
var seeded=[{id:'a',text:'Review PR #214',done:false},{id:'b',text:'Standup 09:30',done:false},{id:'c',text:'Ship onboarding fix',done:false},{id:'d',text:'Read: eval harness notes',done:false}];function loadTasks(){try{var raw=localStorage.getItem('halo.tasks');if(raw){var parsed=JSON.parse(raw);if(Array.isArray(parsed))return parsed.filter(function(x){return x&&typeof x.text==='string'}).map(function(x,i){return{id:String(x.id||('saved'+i)),text:x.text.slice(0,80),done:!!x.done}})}}catch(e){}return seeded.slice()}function saveTasks(){try{localStorage.setItem('halo.tasks',JSON.stringify(tasks))}catch(e){}}var tasks=loadTasks(),tasksEl=document.getElementById('tasks'),taskCount=document.getElementById('taskCount');function positions(){var out={};tasksEl.querySelectorAll('.task-row').forEach(function(el){out[el.dataset.id]=el.getBoundingClientRect().top});return out}function renderTasks(old){tasksEl.textContent='';tasks.forEach(function(task){var row=document.createElement('div');row.className='task-row'+(task.done?' done':'');row.tabIndex=0;row.setAttribute('role','checkbox');row.setAttribute('aria-checked',String(task.done));row.dataset.id=task.id;var check=document.createElement('span');check.className='check';check.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"></path></svg>';var text=document.createElement('span');text.className='task-text';text.textContent=task.text;row.appendChild(check);row.appendChild(text);function toggle(){var before=positions();task.done=!task.done;tasks.sort(function(a,b){return Number(a.done)-Number(b.done)});saveTasks();renderTasks(before)}row.addEventListener('click',toggle);row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});tasksEl.appendChild(row)});var open=tasks.filter(function(t){return !t.done}).length;taskCount.textContent=String(open)+' open';if(old){tasksEl.querySelectorAll('.task-row').forEach(function(el){if(old[el.dataset.id]!==undefined){var delta=old[el.dataset.id]-el.getBoundingClientRect().top;if(delta){el.style.transition='none';el.style.transform='translateY('+delta+'px)';requestAnimationFrame(function(){el.style.transition='transform .32s cubic-bezier(.22,.9,.24,1), opacity .12s ease';el.style.transform='translateY(0)'})}}})}}renderTasks();document.getElementById('taskForm').addEventListener('submit',function(e){e.preventDefault();var input=document.getElementById('taskInput'),value=input.value.trim();if(!value)return;tasks.push({id:'t'+Date.now()+Math.random().toString(16).slice(2),text:value,done:false});saveTasks();renderTasks();input.value='';showToast('Task added')});
var seedMessage={role:'assistant',text:'Morning — 3 things need you today. Want the rundown?'};function loadChat(){try{var raw=localStorage.getItem('halo.chat');if(raw){var parsed=JSON.parse(raw);if(Array.isArray(parsed))return parsed.filter(function(x){return x&&(x.role==='assistant'||x.role==='user')&&typeof x.text==='string'}).slice(-40)}}catch(e){}return[seedMessage]}var chat=loadChat(),messages=document.getElementById('messages');function saveChat(){try{localStorage.setItem('halo.chat',JSON.stringify(chat.slice(-40)))}catch(e){}}function scrollChat(){requestAnimationFrame(function(){messages.scrollTop=messages.scrollHeight})}function addBubble(item){var bubble=document.createElement('div');bubble.className='message '+item.role;bubble.textContent=item.text;messages.appendChild(bubble);scrollChat()}function renderChat(){messages.textContent='';chat.forEach(addBubble);scrollChat()}renderChat();var replies=["Logged. I moved your 14:00 focus block to 15:00 so it doesn't collide with standup.","Done — I filed that under Ship onboarding fix and pinged the thread.","Here's the rundown: PR #214 is one approval short, staging deploy is green, and your focus score is trending +9 this week.","Noted. Want me to draft the release notes while you're in standup?"];var replyCursor=chat.filter(function(m){return m.role==='user'}).length%replies.length;document.getElementById('chatForm').addEventListener('submit',function(e){e.preventDefault();var input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;var user={role:'user',text:text};chat.push(user);chat=chat.slice(-40);saveChat();addBubble(user);input.value='';var typing=document.createElement('div');typing.className='message assistant typing';typing.setAttribute('aria-label','HALO is typing');typing.innerHTML='<i></i><i></i><i></i>';messages.appendChild(typing);scrollChat();var delay=900+Math.floor(Math.random()*501),reply=replies[replyCursor];replyCursor=(replyCursor+1)%replies.length;setTimeout(function(){if(typing.parentNode)typing.parentNode.removeChild(typing);var item={role:'assistant',text:reply};chat.push(item);chat=chat.slice(-40);saveChat();addBubble(item)},delay)});
var track=document.getElementById('track'),viewport=document.getElementById('viewport'),tabs=Array.prototype.slice.call(document.querySelectorAll('.tab')),views=Array.prototype.slice.call(document.querySelectorAll('.view')),active=0;function selectTab(index){active=Math.max(0,Math.min(2,index));track.style.setProperty('--drag','0px');track.style.setProperty('--base',String(-active*33.333333)+'%');tabs.forEach(function(tab,i){tab.classList.toggle('active',i===active);if(i===active)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current')});views.forEach(function(view,i){if(i===active){view.removeAttribute('inert');view.removeAttribute('aria-hidden')}else{view.setAttribute('inert','');view.setAttribute('aria-hidden','true')}});if(active===2){var pulse=document.getElementById('pulseView');pulse.classList.remove('entered');void pulse.offsetWidth;pulse.classList.add('entered')}}tabs.forEach(function(tab){tab.addEventListener('click',function(){selectTab(Number(tab.dataset.tab))})});var startX=0,lastX=0,swiping=false;viewport.addEventListener('touchstart',function(e){if(e.touches.length!==1||e.target.closest('input,button,.task-row'))return;startX=e.touches[0].clientX;lastX=startX;swiping=true;track.classList.add('dragging')},{passive:true});viewport.addEventListener('touchmove',function(e){if(!swiping)return;lastX=e.touches[0].clientX;var dx=lastX-startX;if((active===0&&dx>0)||(active===2&&dx<0))dx*=.25;track.style.setProperty('--drag',dx+'px')},{passive:true});viewport.addEventListener('touchend',function(){if(!swiping)return;swiping=false;track.classList.remove('dragging');var dx=lastX-startX;if(Math.abs(dx)>48)selectTab(active+(dx<0?1:-1));else selectTab(active)});document.getElementById('exportButton').addEventListener('click',function(){showToast('Report saved to Files')});selectTab(0)})();
</script>
</body>
</html>
